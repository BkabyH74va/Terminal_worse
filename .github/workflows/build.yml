name: build

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to an .ipa/.zip/.tar.gz (blank = ipa/ folder, then own release)"
        required: false
        type: string
      source_repo:
        description: "owner/repo to discover from, after your own release"
        required: false
        default: "holzschu/a-shell"
        type: string
      tag:
        description: "Release tag (blank = newest)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "ipa/**"
      - "sign/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKFLOW_REV: "10"
  FALLBACK_BUNDLE_ID: "com.jq.terminal"
  FALLBACK_GROUP_ID: "group.com.jasonquiles.terminal"
  WANT_BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
  WANT_GROUP_ID: ${{ secrets.APP_GROUP_ID }}
  TEAM_ID: ${{ secrets.TEAM_ID }}
  OLD_GROUP: ${{ secrets.OLD_GROUP }}
  OLD_BUNDLE: ${{ secrets.OLD_BUNDLE }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report runner
        run: |
          echo "rev   : $WORKFLOW_REV   (must be 10)"
          echo "arch  : $(uname -m)"
          echo "sha   : $GITHUB_SHA"
          echo "event : $GITHUB_EVENT_NAME"
          echo "repo  : $GITHUB_REPOSITORY"
          echo "want bundle: ${WANT_BUNDLE_ID:-<unset>}"
          echo "want group : ${WANT_GROUP_ID:-<unset>}"
          echo "team       : ${TEAM_ID:-<unset>}"

      - name: Install toolchain
        run: |
          brew install ldid xz coreutils jq
          echo "clang: $(clang --version | head -1)"

      - name: Resolve IPA source
        id: source
        env:
          INPUT_URL: ${{ inputs.ipa_url }}
          OWN_REPO: ${{ github.repository }}
          SRC_REPO: ${{ inputs.source_repo || 'holzschu/a-shell' }}
          TAG: ${{ inputs.tag }}
          SECRET_URL: ${{ secrets.ASHELL_IPA_URL }}
          VARIABLE_URL: ${{ vars.ASHELL_IPA_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "rev     : $WORKFLOW_REV (must be 10)"
          echo "own repo: $OWN_REPO"

          emit() { echo "kind=$1" >> "$GITHUB_OUTPUT"; echo "value=$2" >> "$GITHUB_OUTPUT"; }

          if [ -n "${INPUT_URL:-}" ]; then emit url "$INPUT_URL"; echo "source: dispatch input"; exit 0; fi

          LOCAL="$(find ipa -maxdepth 2 \( -iname '*.ipa' -o -iname '*.zip' \
                   -o -iname '*.tar.gz' -o -iname '*.tgz' \) -print 2>/dev/null | head -1)"
          if [ -n "$LOCAL" ]; then
            emit local "$LOCAL"
            echo "source: repo file $LOCAL"
            exit 0
          fi

          if [ -n "${SECRET_URL:-}" ]; then emit url "$SECRET_URL"; echo "source: secret"; exit 0; fi
          if [ -n "${VARIABLE_URL:-}" ]; then emit url "$VARIABLE_URL"; echo "source: variable"; exit 0; fi

          HDR=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          if [ -n "${GH_TOKEN:-}" ]; then HDR+=(-H "Authorization: Bearer $GH_TOKEN"); fi

          BODY=""
          STATUS="000"
          fetch() {
            local raw
            BODY=""
            STATUS="000"
            raw="$(curl -sS --max-time 30 -w '\n%{http_code}' "${HDR[@]}" "$1")" || raw=""
            [ -n "$raw" ] || return 0
            STATUS="${raw##*$'\n'}"
            BODY="${raw%$'\n'*}"
            [ "$STATUS" = "200" ] || BODY=""
          }

          pick_from() {
            printf '%s' "$1" | jq -r '.assets[]?.browser_download_url' \
              | grep -iE "$2" | head -1 || true
          }

          echo "GET releases/latest on $OWN_REPO"
          fetch "https://api.github.com/repos/$OWN_REPO/releases/latest"
          echo "  status: $STATUS"
          if [ -n "$BODY" ]; then
            n="$(printf '%s' "$BODY" | jq -r '.assets | length')"
            echo "  own assets: $n"
            if [ "$n" -gt 0 ]; then
              printf '%s' "$BODY" | jq -r '.assets[] | "    \(.name)  \(.size) bytes"'
            fi
            url="$(pick_from "$BODY" '\.ipa$')"
            if [ -z "$url" ]; then url="$(pick_from "$BODY" '\.zip$')"; fi
            if [ -z "$url" ]; then url="$(pick_from "$BODY" '\.(tar\.gz|tgz)$')"; fi
            if [ -n "$url" ]; then
              emit url "$url"
              echo "source: own release asset"
              echo "resolved: $url"
              exit 0
            fi
            echo "  own release has no usable asset"
          fi

          echo "GET releases/latest on $SRC_REPO"
          fetch "https://api.github.com/repos/$SRC_REPO/releases/latest"
          echo "  status: $STATUS"
          if [ -z "$BODY" ]; then
            echo "::error::no usable release on $OWN_REPO or $SRC_REPO"
            exit 1
          fi

          tn="$(printf '%s' "$BODY" | jq -r '.tag_name // "?"')"
          cn="$(printf '%s' "$BODY" | jq -r '.assets | length')"
          echo "release: $tn, assets: $cn"
          if [ "$cn" -gt 0 ]; then
            printf '%s' "$BODY" | jq -r '.assets[] | "  \(.name)  \(.size) bytes"'
          fi

          url="$(pick_from "$BODY" '\.ipa$')"
          if [ -z "$url" ]; then url="$(pick_from "$BODY" '\.zip$' | head -1)"; fi
          if [ -z "$url" ]; then url="$(pick_from "$BODY" '\.(tar\.gz|tgz)$')"; fi
          if [ -z "$url" ]; then
            echo "::error::no .ipa/.zip/.tar.gz on $SRC_REPO@$tn"
            exit 1
          fi
          emit url "$url"
          echo "source: $SRC_REPO asset"
          echo "resolved: $url"

      - name: Fetch and unpack IPA
        env:
          KIND: ${{ steps.source.outputs.kind }}
          VALUE: ${{ steps.source.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          if [ "$KIND" = "local" ]; then
            echo "using repo file: $VALUE"
            cp "$VALUE" work/incoming
          else
            case "$VALUE" in
              http://*|https://*) ;;
              *) echo "::error::URL must start with http:// or https:// (got: $VALUE)"; exit 1 ;;
            esac
            AUTH=()
            case "$VALUE" in
              *github.com/*|*githubusercontent.com/*)
                if [ -n "${GH_TOKEN:-}" ]; then
                  AUTH=(-H "Authorization: Bearer $GH_TOKEN")
                  echo "auth: token"
                fi
                ;;
            esac
            if ! curl -fL --location-trusted --retry 3 --retry-delay 2 \
                 --max-time 900 "${AUTH[@]}" -o work/incoming "$VALUE"; then
              echo "::error::download failed"
              echo "::error::url was: $VALUE"
              exit 1
            fi
          fi

          echo "size: $(wc -c < work/incoming) bytes"
          ftype="$(file -b work/incoming)"
          echo "type: $ftype"

          mkdir -p work/unpacked
          case "$ftype" in
            *Zip*) unzip -q work/incoming -d work/unpacked ;;
            *gzip*|*tar*) tar -xzf work/incoming -C work/unpacked ;;
            *)
              echo "::error::unrecognised archive type: $ftype"
              head -c 300 work/incoming
              exit 1
              ;;
          esac

          if [ ! -d work/unpacked/Payload ]; then
            inner="$(find work/unpacked -maxdepth 4 \( -iname '*.ipa' -o -iname '*.zip' \) -print -quit)"
            if [ -n "$inner" ]; then
              echo "nested archive: $inner"
              unzip -q "$inner" -d work/unpacked2
              rm -rf work/unpacked
              mv work/unpacked2 work/unpacked
            fi
          fi

          FOUND="$(find work/unpacked -maxdepth 6 -name '*.app' -print -quit)"
          if [ -z "$FOUND" ]; then
            echo "::error::no .app inside the archive"
            ls -A work/unpacked | head -30
            exit 1
          fi
          echo "found: $FOUND"

          # move into place BEFORE anything downstream uses $APP
          rm -rf work/Terminal.app
          mv "$FOUND" work/Terminal.app
          APP=work/Terminal.app
          echo "app: $APP"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP missing after move"
            exit 1
          fi

          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || true)"
          if [ -z "$EXEC" ] || [ ! -f "$APP/$EXEC" ]; then
            EXEC="$(find "$APP" -maxdepth 1 -type f -perm -u+x -print -quit | xargs -r basename)"
          fi
          echo "executable: ${EXEC:-<unresolved>}"
          if [ -z "$EXEC" ] || [ ! -f "$APP/$EXEC" ]; then
            echo "::error::cannot resolve main executable"
            ls -la "$APP" | head -30
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "EXEC=$EXEC" >> "$GITHUB_ENV"

          echo "--- current identity ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist" 2>/dev/null || echo "(no AppGroupIdentifier)"

      - name: Resolve identity from profile
        run: |
          set -euo pipefail
          APP="$APP"
          PROF="$APP/embedded.mobileprovision"

          # a committed profile is authoritative and trusted outright
          explicit=""
          if [ -f sign/profile.mobileprovision ]; then
            echo "using committed sign/profile.mobileprovision"
            cp sign/profile.mobileprovision "$PROF"
            explicit=1
          fi

          if [ ! -f "$PROF" ]; then
            echo "::error::no profile: payload has none and sign/profile.mobileprovision is absent"
            echo "::error::commit your own profile at sign/profile.mobileprovision"
            exit 1
          fi

          if ! security cms -D -i "$PROF" > work/prof.plist 2>/dev/null; then
            echo "::error::profile does not decode; re-export it from the portal"
            exit 1
          fi

          p_team="$(plutil -extract TeamIdentifier.0 raw -o - work/prof.plist 2>/dev/null || true)"
          p_bundle="$(plutil -extract Entitlements.application-identifier raw -o - work/prof.plist 2>/dev/null || true)"
          p_bundle="${p_bundle#*.}"
          p_group="$(plutil -extract Entitlements.com.apple.security.application-groups json -o - work/prof.plist 2>/dev/null | jq -r '.[0] // empty' || true)"
          p_exp="$(plutil -extract ExpirationDate raw -o - work/prof.plist 2>/dev/null || true)"

          echo "profile team  : ${p_team:-<none>}"
          echo "profile bundle: ${p_bundle:-<none>}"
          echo "profile group : ${p_group:-<none>}"
          echo "profile expiry: ${p_exp:-<none>}"

          if [ -n "$p_exp" ]; then
            exp_epoch="$(date -j -f '%Y-%m-%dT%H:%M:%SZ' "$p_exp" '+%s' 2>/dev/null || true)"
            if [ -n "$exp_epoch" ] && [ "$exp_epoch" -lt "$(date '+%s')" ]; then
              echo "::error::profile expired on $p_exp; re-export it"
              exit 1
            fi
          fi

          if [ -z "${TEAM_ID:-}" ]; then
            if [ -z "$p_team" ]; then
              echo "::error::no team in profile and TEAM_ID unset"
              exit 1
            fi
            echo "::warning::TEAM_ID unset; adopting profile team $p_team"
            TEAM_ID="$p_team"
            echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          elif [ -n "$p_team" ] && [ "$p_team" != "$TEAM_ID" ]; then
            echo "::error::profile team '$p_team' != TEAM_ID '$TEAM_ID'; codesign will fail"
            echo "::error::export a profile for team '$TEAM_ID' or clear the secret"
            exit 1
          fi

          trusted="$explicit"
          if [ -z "$trusted" ] && [ -n "$p_team" ] && [ "$p_team" = "$TEAM_ID" ]; then trusted=1; fi
          if [ -z "$trusted" ]; then
            echo "::error::payload profile belongs to team '${p_team:-?}', not yours"
            echo "::error::commit your own profile at sign/profile.mobileprovision"
            exit 1
          fi

          bundle="${WANT_BUNDLE_ID:-}"
          if [ -z "$bundle" ] && [ -n "$p_bundle" ] && [ "$p_bundle" != *'*' ]; then
            bundle="$p_bundle"
          fi
          if [ -z "$bundle" ]; then
            if [ "$p_bundle" = *'*' ]; then
              echo "profile uses a wildcard app id; using $FALLBACK_BUNDLE_ID"
            fi
            bundle="$FALLBACK_BUNDLE_ID"
          fi

          group="${WANT_GROUP_ID:-}"
          if [ -z "$group" ] && [ -n "$p_group" ]; then group="$p_group"; fi
          if [ -z "$group" ]; then group="$FALLBACK_GROUP_ID"; fi

          echo "final bundle: $bundle (${#bundle} chars)"
          echo "final group : $group"
          if [ "${#bundle}" -gt 18 ]; then
            echo "::warning::$bundle is ${#bundle} chars; Mach-O string patch skips above 18"
            echo "::warning::use a shorter App ID if the binary must carry it"
          fi

          if [ "$p_bundle" = *'*' ]; then
            suffix="${p_bundle#\*}"
            case "$bundle" in
              *"$suffix") ;;
              *)
                echo "::error::profile wildcard '$p_bundle' does not match '$bundle'"
                exit 1
                ;;
            esac
          elif [ "$p_bundle" != "$bundle" ]; then
            echo "::error::profile is for '$p_bundle' but target is '$bundle'"
            echo "::error::set BUNDLE_ID=$p_bundle (and APP_GROUP_ID=$p_group)"
            echo "::error::or export a profile for '$bundle'"
            exit 1
          fi

          if [ -z "$p_group" ]; then
            echo "::error::profile carries no application-groups entitlement"
            echo "::error::enable the App Group on the App ID, then re-export"
            exit 1
          fi
          if [ "$p_group" != "$group" ]; then
            echo "::error::profile carries group '$p_group', not '$group'"
            echo "::error::set APP_GROUP_ID=$p_group, or enable '$group' and re-export"
            exit 1
          fi

          echo "BUNDLE_ID=$bundle" >> "$GITHUB_ENV"
          echo "APP_GROUP_ID=$group" >> "$GITHUB_ENV"

      - name: Rewrite author identity
        run: |
          args=(--app "$APP" --new-group "$APP_GROUP_ID" --new-bundle "$BUNDLE_ID")
          if [ -n "$OLD_GROUP" ]; then args+=(--old-group "$OLD_GROUP"); fi
          if [ -n "$OLD_BUNDLE" ]; then args+=(--old-bundle "$OLD_BUNDLE"); fi
          python3 scripts/rewrite_ids.py "${args[@]}"
          echo "--- after rewrite ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist"

      - name: Build dylib
        env:
          APP: ${{ env.APP }}
          OUT: work/TerminalSBX.dylib
          PROFILE: work/Terminal.app/embedded.mobileprovision
        run: bash scripts/build_dylib_ci.sh

      - name: Inject load command
        run: |
          cp work/TerminalSBX.dylib "$APP/"
          BIN="$APP/$EXEC"
          echo "target binary: $BIN"
          if python3 scripts/inject_dylib.py "$BIN" \
               @executable_path/TerminalSBX.dylib 2>/dev/null; then
            echo "injected with inject_dylib.py"
          elif python3 scripts/inject_dylib.py --binary "$BIN" \
               --dylib @executable_path/TerminalSBX.dylib; then
            echo "injected with inject_dylib.py (flag form)"
          else
            curl -fsSL -o /tmp/insert_dylib \
              https://github.com/tyilo/insert_dylib/releases/latest/download/insert_dylib
            chmod +x /tmp/insert_dylib
            /tmp/insert_dylib --inplace --weak \
              @executable_path/TerminalSBX.dylib "$BIN"
            echo "injected with insert_dylib"
          fi
          otool -L "$BIN" | grep -qi terminalsbx \
            || { echo "::error::dylib not in load commands"; exit 1; }

      - name: Patch app
        run: |
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :AppGroupIdentifier $APP_GROUP_ID" \
            "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :AppGroupIdentifier string $APP_GROUP_ID" \
              "$APP/Info.plist"
          echo "bundle: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "group : $(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist")"
          grep -qF "$APP_GROUP_ID" scripts/ent.plist \
            || echo "::warning::ent.plist group does not match $APP_GROUP_ID"

      - name: Sign
        run: bash scripts/sign_all.sh "$APP"

      - name: Package
        run: |
          mkdir -p work/Payload
          cp -R "$APP" work/Payload/
          (cd work && zip -qry Terminal.ipa Payload)
          shasum -a 256 work/Terminal.ipa | tee work/Terminal.ipa.sha256
          ls -lh work/Terminal.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-2.3.2-${{ github.run_number }}
          path: |
            work/Terminal.ipa
            work/Terminal.ipa.sha256
          if-no-files-found: error
          retention-days: 30
