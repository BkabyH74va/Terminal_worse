name: build

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL of the a-Shell 2.3.2 IPA (overrides the secret)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_GROUP_ID: ${{ secrets.APP_GROUP_ID || 'group.com.jasonquiles.terminal' }}
  BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.jasonquiles.terminal' }}
  TEAM_ID: ${{ secrets.TEAM_ID || '' }}
  ASHELL_VERSION: "2.3.2"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          brew install ldid xz coreutils
          python3 -m pip install --quiet --upgrade pip
          echo "clang: $(clang --version | head -1)"

      - name: Resolve IPA source
        id: source
        env:
          INPUT_URL: ${{ inputs.ipa_url }}
          SECRET_URL: ${{ secrets.ASHELL_IPA_URL }}
        run: |
          url="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$url" ]; then
            echo "::error::no IPA URL (set the ASHELL_IPA_URL secret or pass ipa_url)"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download and unpack IPA
        env:
          IPA_URL: ${{ steps.source.outputs.url }}
        run: |
          mkdir -p work
          curl -fL --retry 3 --retry-delay 2 -o work/ashell.ipa "$IPA_URL"
          file work/ashell.ipa
          unzip -q work/ashell.ipa -d work/unpacked
          APP="$(find work/unpacked/Payload -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::Payload contains no .app"
            find work/unpacked -maxdepth 3 -print
            exit 1
          fi
          mv "$APP" work/Terminal.app
          echo "APP=work/Terminal.app" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' work/Terminal.app/Info.plist

      - name: Rewrite author identity
        env:
          OLD_GROUP: "group.com.cert.account.t260930000125.01"
          OLD_BUNDLE: ${{ secrets.OLD_BUNDLE_ID || '' }}
        run: |
          args=(--app "$APP" --new-group "$APP_GROUP_ID" --new-bundle "$BUNDLE_ID")
          if [ -n "$OLD_GROUP" ]; then args+=(--old-group "$OLD_GROUP"); fi
          if [ -n "$OLD_BUNDLE" ]; then args+=(--old-bundle "$OLD_BUNDLE"); fi
          python3 scripts/rewrite_ids.py "${args[@]}"

      - name: Build dylib
        run: |
          mkdir -p work/out
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=16.0 \
            -dynamiclib -fobjc-arc -O2 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -framework Security -framework Metal \
            -DSBX_APP_GROUP="\"$APP_GROUP_ID\"" \
            -DSBX_APP_GROUP_BUNDLE_ID="\"$BUNDLE_ID\"" \
            -install_name @executable_path/TerminalSBX.dylib \
            -o work/out/TerminalSBX.dylib \
            src/TerminalSBX.m
          lipo -info work/out/TerminalSBX.dylib
          cp work/out/TerminalSBX.dylib "$APP/"

      - name: Inject load command
        run: |
          if command -v insert_dylib >/dev/null 2>&1; then
            insert_dylib --inplace --weak \
              @executable_path/TerminalSBX.dylib "$APP/Terminal"
          else
            curl -fsSL -o /tmp/insert_dylib \
              https://github.com/tyilo/insert_dylib/releases/latest/download/insert_dylib
            chmod +x /tmp/insert_dylib
            /tmp/insert_dylib --inplace --weak \
              @executable_path/TerminalSBX.dylib "$APP/Terminal"
          fi
          otool -L "$APP/Terminal" | grep -i terminalsbx

      - name: Patch app
        run: |
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.jasonquiles.terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :AppGroupIdentifier $APP_GROUP_ID" \
            "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :AppGroupIdentifier string $APP_GROUP_ID" \
              "$APP/Info.plist"
          echo "group in plist: $(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist")"
          grep -q "$APP_GROUP_ID" scripts/ent.plist \
            || echo "::warning::ent.plist group does not match plist group"

      - name: Sign
        run: |
          if [ -z "$TEAM_ID" ]; then
            echo "::error::TEAM_ID secret is empty"
            exit 1
          fi
          sed "s/TEAMID/$TEAM_ID/g" scripts/ent.plist > work/ent.plist
          /usr/libexec/PlistBuddy -c 'Print' work/ent.plist
          ldid -S work/ent.plist "$APP/Terminal"
          ldid -S work/ent.plist "$APP/TerminalSBX.dylib"
          codesign --force --sign - --timestamp=none \
            --entitlements work/ent.plist \
            --preserve-metadata=identifier,flags \
            "$APP/Frameworks/"*.framework 2>/dev/null || true
          codesign --force --sign - --timestamp=none \
            --entitlements work/ent.plist "$APP"
          codesign -dv --entitlements :- "$APP" 2>&1 | head -40

      - name: Verify entitlements
        run: |
          codesign -d --entitlements :- "$APP" 2>/dev/null > work/check.plist || true
          if grep -q "$APP_GROUP_ID" work/check.plist; then
            echo "group entitlement present"
          else
            echo "::warning::group $APP_GROUP_ID not found in signed entitlements"
          fi
          test -f "$APP/TerminalSBX.dylib"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

      - name: Package
        run: |
          mkdir -p work/Payload
          cp -R "$APP" work/Payload/
          (cd work && zip -qry Terminal.ipa Payload)
          shasum -a 256 work/Terminal.ipa | tee work/Terminal.ipa.sha256
          ls -lh work/Terminal.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-${{ env.ASHELL_VERSION }}-${{ github.run_number }}
          path: |
            work/Terminal.ipa
            work/Terminal.ipa.sha256
          if-no-files-found: error
          retention-days: 30
