name: build

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to an .ipa or .zip (blank = ipa/ folder, then auto-discover)"
        required: false
        type: string
      tag:
        description: "Release tag to inspect (blank = newest)"
        required: false
        default: "2.3.2"
        type: string
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "ipa/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_GROUP_ID: ${{ secrets.APP_GROUP_ID || 'group.com.jasonquiles.terminal' }}
  BUNDLE_ID: ${{ secrets.BUNDLE_ID || 'com.jasonquiles.terminal' }}
  TEAM_ID: ${{ secrets.TEAM_ID }}
  OLD_GROUP: ${{ secrets.OLD_GROUP }}
  OLD_BUNDLE: ${{ secrets.OLD_BUNDLE }}
  UPSTREAM_REPO: "holzschu/a-shell"

jobs:
  build:
    # macos-latest resolves unconditionally; cross-compiling to arm64 works
    # from the x86_64 image.  The old arm64 label needed a registered runner.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report runner
        run: |
          echo "arch  : $(uname -m)"
          echo "xcode : $(xcodebuild -version | head -1)"
          echo "sha   : $GITHUB_SHA"
          echo "ref   : $GITHUB_REF"

      - name: Install toolchain
        run: |
          brew install ldid xz coreutils jq
          echo "clang: $(clang --version | head -1)"
          echo "jq   : $(jq --version)"

      - name: Resolve IPA source
        id: source
        env:
          INPUT_URL: ${{ inputs.ipa_url }}
          TAG: ${{ inputs.tag }}
          SECRET_URL: ${{ secrets.ASHELL_IPA_URL }}
          VARIABLE_URL: ${{ vars.ASHELL_IPA_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          show() { if [ -n "$2" ]; then echo "$1: set"; else echo "$1: unset"; fi; }
          show "input"    "${INPUT_URL:-}"
          show "secret"   "${SECRET_URL:-}"
          show "variable" "${VARIABLE_URL:-}"
          echo  "tag     : ${TAG:-<blank>}"

          emit() { echo "kind=$1" >> "$GITHUB_OUTPUT"; echo "value=$2" >> "$GITHUB_OUTPUT"; }

          # 1-3: explicit configuration always wins
          if [ -n "${INPUT_URL:-}" ]; then emit url "$INPUT_URL"; echo "source: dispatch input"; exit 0; fi
          if [ -n "${SECRET_URL:-}" ]; then emit url "$SECRET_URL"; echo "source: secret"; exit 0; fi
          if [ -n "${VARIABLE_URL:-}" ]; then emit url "$VARIABLE_URL"; echo "source: variable"; exit 0; fi

          # 4: a committed .ipa/.zip needs no network at all
          LOCAL="$(find ipa -maxdepth 2 \( -iname '*.ipa' -o -iname '*.zip' \) -print 2>/dev/null | head -1)"
          if [ -n "$LOCAL" ]; then
            emit local "$LOCAL"
            echo "source: repo file $LOCAL"
            exit 0
          fi

          # 5: API, authenticated, with the status kept instead of discarded
          API="https://api.github.com/repos/$UPSTREAM_REPO/releases"
          HDR=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          if [ -n "${GH_TOKEN:-}" ]; then
            HDR+=(-H "Authorization: Bearer $GH_TOKEN")
            echo "api auth: token (5000/hr)"
          else
            echo "api auth: anonymous (60/hr, shared IP)"
          fi

          BODY=""
          STATUS="000"
          fetch() {
            local raw
            BODY=""
            STATUS="000"
            raw="$(curl -sS --max-time 30 -w '\n%{http_code}' "${HDR[@]}" "$API/$1")" || raw=""
            if [ -z "$raw" ]; then
              return 0
            fi
            STATUS="${raw##*$'\n'}"
            BODY="${raw%$'\n'*}"
            if [ "$STATUS" != "200" ]; then
              BODY=""
            fi
          }

          if [ -n "${TAG:-}" ]; then
            echo "GET releases/tags/$TAG"
            fetch "tags/$TAG"
            echo "  status: $STATUS"
            if [ "$STATUS" = "404" ]; then
              echo "  tag does not exist"
            fi
          fi

          if [ -z "$BODY" ]; then
            echo "GET releases/latest"
            fetch "latest"
            echo "  status: $STATUS"
          fi

          # 6: HTML asset listing, no API quota consumed
          if [ -z "$BODY" ]; then
            echo "::warning::API unusable (last status $STATUS); trying HTML listing"
            tag_html="${TAG:-}"
            if [ -z "$tag_html" ]; then
              loc="$(curl -sS -o /dev/null -w '%{redirect_url}' \
                     "https://github.com/$UPSTREAM_REPO/releases/latest" || true)"
              tag_html="${loc##*/}"
            fi
            echo "html tag: ${tag_html:-<unknown>}"
            if [ -n "$tag_html" ] && [ "$tag_html" != "latest" ]; then
              html="$(curl -fsSL --max-time 30 \
                      "https://github.com/$UPSTREAM_REPO/releases/expanded_assets/$tag_html" 2>/dev/null || true)"
              if [ -n "$html" ]; then
                echo "assets on $tag_html (html):"
                printf '%s' "$html" | grep -oE '/[^"/]+/[^"/]+/releases/download/[^"]+' \
                  | sort -u | sed 's/^/  /' || true
                rel="$(printf '%s' "$html" | grep -oE '/[^"]+\.ipa' | head -1 || true)"
                if [ -n "$rel" ]; then
                  emit url "https://github.com$rel"
                  echo "source: html asset"
                  echo "resolved: https://github.com$rel"
                  exit 0
                fi
              fi
            fi
          fi

          if [ -z "$BODY" ]; then
            echo "::error::no release data from API or HTML (last status $STATUS)"
            echo "::error::see https://github.com/$UPSTREAM_REPO/releases"
            exit 1
          fi

          tag_name="$(printf '%s' "$BODY" | jq -r '.tag_name // "?"')"
          count="$(printf '%s' "$BODY" | jq -r '.assets | length')"
          echo "release: $tag_name, uploaded assets: $count"
          if [ "$count" -gt 0 ]; then
            printf '%s' "$BODY" | jq -r '.assets[] | "  \(.name)  \(.size) bytes"'
          fi

          if [ "$count" -eq 0 ]; then
            echo "::error::release $tag_name carries no uploaded assets (source-only tag)"
            echo "::error::commit an .ipa under ipa/ or paste a direct link"
            exit 1
          fi

          url="$(printf '%s' "$BODY" | jq -r '.assets[]?.browser_download_url' \
                 | grep -iE '\.ipa$' | head -1 || true)"
          if [ -z "$url" ]; then
            url="$(printf '%s' "$BODY" | jq -r '.assets[]?.browser_download_url' \
                   | grep -iE '\.zip$' | grep -viE 'source|src' | head -1 || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::no .ipa and no usable .zip among the assets listed above"
            exit 1
          fi

          emit url "$url"
          echo "source: discovered asset"
          echo "resolved: $url"

      - name: Fetch and unpack IPA
        env:
          KIND: ${{ steps.source.outputs.kind }}
          VALUE: ${{ steps.source.outputs.value }}
        run: |
          mkdir -p work
          if [ "$KIND" = "local" ]; then
            echo "using repo file: $VALUE"
            cp "$VALUE" work/incoming
          else
            case "$VALUE" in
              http://*|https://*) ;;
              *) echo "::error::URL must start with http:// or https:// (got: $VALUE)"; exit 1 ;;
            esac
            case "$VALUE" in
              *drive.google.com*|*dropbox.com/s/*)
                echo "::warning::share link, not a direct download"
                echo "::warning::Drive needs /uc?export=download&id=..., Dropbox needs ?dl=1"
                ;;
            esac
            if ! curl -fL --retry 3 --retry-delay 2 --max-time 300 -o work/incoming "$VALUE"; then
              echo "::error::download failed (404, auth wall, or bad link)"
              echo "::error::url was: $VALUE"
              exit 1
            fi
          fi

          echo "size: $(wc -c < work/incoming) bytes"
          echo "type: $(file -b work/incoming)"

          if unzip -tq work/incoming >/dev/null 2>&1; then
            unzip -q work/incoming -d work/unpacked
          else
            echo "::error::not a valid zip/ipa; content-type was probably HTML"
            head -c 300 work/incoming
            exit 1
          fi

          if [ ! -d work/unpacked/Payload ]; then
            inner="$(find work/unpacked -maxdepth 3 -iname '*.ipa' -print -quit)"
            if [ -z "$inner" ]; then
              echo "::error::no Payload/ in archive and no nested .ipa"
              find work/unpacked -maxdepth 3
              exit 1
            fi
            echo "nested ipa: $inner"
            unzip -q "$inner" -d work/unpacked2
            rm -rf work/unpacked
            mv work/unpacked2 work/unpacked
          fi

          APP="$(find work/unpacked/Payload -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::Payload has no .app"
            find work/unpacked -maxdepth 3
            exit 1
          fi
          mv "$APP" work/Terminal.app
          echo "APP=work/Terminal.app" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' work/Terminal.app/Info.plist

      - name: Rewrite author identity
        run: |
          args=(--app "$APP" --new-group "$APP_GROUP_ID" --new-bundle "$BUNDLE_ID")
          if [ -n "$OLD_GROUP" ]; then args+=(--old-group "$OLD_GROUP"); fi
          if [ -n "$OLD_BUNDLE" ]; then args+=(--old-bundle "$OLD_BUNDLE"); fi
          python3 scripts/rewrite_ids.py "${args[@]}"

      - name: Build dylib
        env:
          APP: ${{ env.APP }}
          OUT: work/TerminalSBX.dylib
          PROFILE: work/Terminal.app/embedded.mobileprovision
        run: bash scripts/build_dylib_ci.sh

      - name: Inject load command
        run: |
          cp work/TerminalSBX.dylib "$APP/"
          if python3 scripts/inject_dylib.py "$APP/Terminal" \
               @executable_path/TerminalSBX.dylib 2>/dev/null; then
            echo "injected with inject_dylib.py"
          elif python3 scripts/inject_dylib.py --binary "$APP/Terminal" \
               --dylib @executable_path/TerminalSBX.dylib; then
            echo "injected with inject_dylib.py (flag form)"
          else
            curl -fsSL -o /tmp/insert_dylib \
              https://github.com/tyilo/insert_dylib/releases/latest/download/insert_dylib
            chmod +x /tmp/insert_dylib
            /tmp/insert_dylib --inplace --weak \
              @executable_path/TerminalSBX.dylib "$APP/Terminal"
            echo "injected with insert_dylib"
          fi
          otool -L "$APP/Terminal" | grep -qi terminalsbx \
            || { echo "::error::dylib not in load commands"; exit 1; }

      - name: Patch app
        run: |
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Terminal' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :AppGroupIdentifier $APP_GROUP_ID" \
            "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :AppGroupIdentifier string $APP_GROUP_ID" \
              "$APP/Info.plist"
          echo "group in plist: $(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist")"
          grep -qF "$APP_GROUP_ID" scripts/ent.plist \
            || echo "::warning::ent.plist group does not match $APP_GROUP_ID"

      - name: Sign
        run: bash scripts/sign_all.sh "$APP"

      - name: Package
        run: |
          mkdir -p work/Payload
          cp -R "$APP" work/Payload/
          (cd work && zip -qry Terminal.ipa Payload)
          shasum -a 256 work/Terminal.ipa | tee work/Terminal.ipa.sha256
          ls -lh work/Terminal.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-2.3.2-${{ github.run_number }}
          path: |
            work/Terminal.ipa
            work/Terminal.ipa.sha256
          if-no-files-found: error
          retention-days: 30
