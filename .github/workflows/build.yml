name: Build Terminal_worse IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build for iOS
      run: |
        xcodebuild \
          -project Terminal_worse.xcodeproj \
          -scheme Terminal_worse \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
    
    - name: Create IPA
      run: |
        APP=$(find DerivedData -name "*.app" -type d | head -1)
        mkdir -p Payload
        cp -r "$APP" Payload/
        zip -r Terminal_worse.ipa Payload/
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Terminal_worse-ipa
        path: Terminal_worse.ipa
